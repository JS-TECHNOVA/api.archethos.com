      - hero_image_detail
    PublicMedia:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        source:
          type: string
          nullable: true
          readOnly: true
        thumbnail_url:
          type: string
          nullable: true
          readOnly: true
        media_type:
          type: string
          maxLength: 20
        title:
          type: string
          maxLength: 255
        alt_text:
          type: string
          maxLength: 255
      required:
      - id
      - source
      - thumbnail_url
    StatusEnum:
