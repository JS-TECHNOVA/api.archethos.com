services:
  db:
    image: postgres:17-alpine
    container_name: archethos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-archethos}
      POSTGRES_USER: ${DB_USER:-archethos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-archethos}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - archethos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-archethos} -d ${DB_NAME:-archethos}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  archethos_pgdata:
