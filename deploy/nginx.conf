# Archethos API — nginx site.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/api.archethos.com
#   sudo ln -s /etc/nginx/sites-available/api.archethos.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add the TLS block:
#   sudo certbot --nginx -d api.archethos.com
#
# Run certbot BEFORE pasting in a 443 block by hand — it rewrites this file and
# hand-written TLS directives are what its edits usually collide with.

upstream archethos_api {
    server unix:/run/archethos/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.archethos.com;

    # certbot writes its challenge here and adds the redirect to 443 itself.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.archethos.com;

    # certbot fills these in with `--nginx`. Left as-is, nginx will not start.
    # ssl_certificate     /etc/letsencrypt/live/api.archethos.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.archethos.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ⚠️ The media library accepts 20 MB uploads (MAX_UPLOAD_SIZE_MB). nginx
    # defaults to 1 MB and answers 413 before Django ever sees the request —
    # which looks like a broken upload endpoint rather than a proxy limit.
    # Keep this comfortably above the Django limit so Django owns the rejection
    # and can return a useful message.
    client_max_body_size 25M;
    client_body_timeout 120s;

    # Django sets HSTS itself; leaving it to one place avoids two sources of
    # truth for the max-age.
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/archethos-api.access.log;
    error_log  /var/log/nginx/archethos-api.error.log;

    # ── Static files ─────────────────────────────────────────────────────────
    # Collected by `manage.py collectstatic`. Effectively only Django Admin and
    # the API docs page use these.
    location /static/ {
        alias /var/www/api.archethos.com/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Uploaded media ───────────────────────────────────────────────────────
    # Served straight from disk; the request never reaches Django, which is the
    # point of storing a relative path rather than routing files through the app.
    location /media/ {
        alias /var/www/api.archethos.com/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";

        # Uploads are validated on the way in, but serving them from the same
        # origin as the API means a stored file must never be executed or
        # rendered as a document in the user's browser session.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition "inline" always;
    }

    location /health/ {
        proxy_pass http://archethos_api;
        access_log off;
    }

    location / {
        proxy_pass http://archethos_api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django's SECURE_PROXY_SSL_HEADER reads this to know the original
        # request was HTTPS. Without it every response 301-redirects to itself.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
