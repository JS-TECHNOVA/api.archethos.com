# Archethos API — nginx site.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/api.archethos.com
#   sudo ln -sf /etc/nginx/sites-available/api.archethos.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl restart nginx
#
#   sudo certbot --nginx -d api.archethos.com
#
# ── Why there is no 443 block here ───────────────────────────────────────────
# This file is HTTP-only on purpose, and complete. `certbot --nginx` copies this
# entire server block into a new one on 443, adds the certificate paths, and
# turns this one into a redirect.
#
# That ordering matters. A hand-written 443 block cannot start before the
# certificate exists, and any directive added by hand afterwards is liable to be
# lost the next time certbot edits the file. Letting certbot do the copy means
# client_max_body_size and the static/media locations below are carried into the
# TLS block automatically, and stay there.

upstream archethos_api {
    server unix:/run/archethos/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.archethos.com;

    # certbot writes its HTTP-01 challenge here. It must stay reachable over
    # plain HTTP even after the redirect is added, or renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ⚠️ The media library accepts 20 MB uploads (MAX_UPLOAD_SIZE_MB). nginx
    # defaults to 1 MB and answers 413 before Django sees the request — which
    # looks like a broken upload endpoint rather than a proxy limit. Keep this
    # above the Django limit so Django owns the rejection and can explain it.
    client_max_body_size 25M;
    client_body_timeout 120s;

    # Django sets HSTS itself once it is behind TLS; keeping it in one place
    # avoids two sources of truth for the max-age.
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/archethos-api.access.log;
    error_log  /var/log/nginx/archethos-api.error.log;

    # ── Static files ─────────────────────────────────────────────────────────
    # Written by `manage.py collectstatic`. In practice only Django Admin and
    # the API docs page use these.
    location /static/ {
        alias /var/www/api.archethos.com/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Uploaded media ───────────────────────────────────────────────────────
    # Served straight from disk; the request never reaches Django, which is the
    # point of storing a relative path rather than streaming files through the
    # application.
    location /media/ {
        alias /var/www/api.archethos.com/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";

        # Uploads are validated on the way in, but they are served from the same
        # origin as the API — so a stored file must never be sniffed into being
        # executed or rendered as a document in a signed-in user's session.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition "inline" always;
    }

    location /health/ {
        proxy_pass http://archethos_api;
        access_log off;
    }

    location / {
        proxy_pass http://archethos_api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SECURE_PROXY_SSL_HEADER reads this to know the original request was
        # HTTPS. Without it, SECURE_SSL_REDIRECT sends the browser into an
        # infinite redirect loop once TLS is on.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}

# ── HTTP/2, after certbot ────────────────────────────────────────────────────
# Optional, and version-dependent. The standalone `http2 on;` directive is
# nginx 1.25+; Ubuntu 24.04 ships 1.24, where it is a `listen` parameter and
# `http2 on;` fails to parse with "unknown directive".
#
#   nginx -v
#   1.25+   add:      http2 on;
#   1.24    edit to:  listen 443 ssl http2;
